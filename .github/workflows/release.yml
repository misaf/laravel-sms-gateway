name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, for example v1.0.0
        required: true
        type: string
      previous_tag:
        description: Previous version tag. Leave empty for the first release.
        required: false
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Resolve previous tag
        id: previous-tag
        run: |
          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "value=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "value=$previous_tag" >> "$GITHUB_OUTPUT"
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}

      - name: Generate release notes
        run: |
          args=(
            -X POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$VERSION"
            -f "target_commitish=$GITHUB_SHA"
            -f "configuration_file_path=.github/release.yml"
            --jq ".body"
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          fi

          gh api "${args[@]}" > /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.previous-tag.outputs.value }}

      - name: Update changelog
        run: |
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;
          const releaseVersion = version.replace(/^v/, '');
          const date = new Date().toISOString().slice(0, 10);
          const notes = fs.readFileSync('/tmp/release-notes.md', 'utf8').trim();
          const entry = `## ${releaseVersion} - ${date}\n\n${notes}\n`;
          const path = 'CHANGELOG.md';

          let changelog = fs.existsSync(path)
            ? fs.readFileSync(path, 'utf8')
            : '# Changelog\n\nAll notable changes to `laravel-sms-gateway` will be documented in this file.\n';

          const unreleasedPattern = /^## Unreleased\s*[\s\S]*?(?=^## |\s*$)/m;

          if (changelog.match(unreleasedPattern)) {
            changelog = changelog.replace(unreleasedPattern, entry);
          } else {
            const firstReleaseIndex = changelog.search(/^## /m);

            changelog = firstReleaseIndex === -1
              ? `${changelog.trimEnd()}\n\n${entry}`
              : `${changelog.slice(0, firstReleaseIndex)}${entry}\n${changelog.slice(firstReleaseIndex)}`;
          }

          fs.writeFileSync(path, changelog.trimEnd() + '\n');
          NODE
        env:
          VERSION: ${{ inputs.version }}

      - name: Commit changelog
        run: |
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git commit -m "Update changelog for $VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create tag
        run: git tag -a "$VERSION" -m "Release $VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Push changelog and tag
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create GitHub release
        run: |
          args=(
            "$VERSION"
            --title "$VERSION"
            --notes-file /tmp/release-notes.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
